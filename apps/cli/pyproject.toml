[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "observa-cli"
version = "0.1.0"
description = "CLI for Observa FinOps governance"
requires-python = ">=3.12"
license = "Apache-2.0"

[project.scripts]
observa = "observa_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["observa_cli*"]
