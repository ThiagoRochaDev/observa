apiVersion: v1
kind: Namespace
metadata:
  name: observa
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observa-data
  namespace: observa
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observa-api
  namespace: observa
spec:
  replicas: 1
  selector:
    matchLabels: { app: observa-api }
  template:
    metadata:
      labels: { app: observa-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: observa-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: observa-data
---
apiVersion: v1
kind: Service
metadata:
  name: observa-api
  namespace: observa
spec:
  selector: { app: observa-api }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observa-web
  namespace: observa
spec:
  replicas: 1
  selector:
    matchLabels: { app: observa-web }
  template:
    metadata:
      labels: { app: observa-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: observa-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: observa-web
  namespace: observa
spec:
  selector: { app: observa-web }
  ports:
    - name: http
      port: 3000
      targetPort: http
