name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/connectors[all]" -e "apps/api" pip-audit bandit
      - run: pip-audit
      - run: bandit -q -r apps/api/app packages/connectors/observa_connectors

  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, mobile]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
